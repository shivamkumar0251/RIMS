tags:
  - name: Categories
    description: Category endpoints

paths:
  /v1/categories/getCategories:
    get:
      summary: Get categories for the franchise with search and pagination
      tags:
        - Categories
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
        - in: query
          name: fromDate
          schema:
            type: string
            format: date
        - in: query
          name: toDate
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK

  /v1/categories/addCategory:
    post:
      summary: Add a new category (admin)
      tags:
        - Categories
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                categoryName:
                  type: string
      responses:
        '201':
          description: Created

  /v1/categories/bulk-excel:
    post:
      summary: Bulk create categories and sub-categories from Excel
      tags:
        - Categories
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Excel file (.xlsx/.xls) with columns `categoryName` and `subCategoryName`
      responses:
        '200':
          description: Bulk import finished
        '400':
          description: Bad Request
        '500':
          description: Server Error

  /v1/categories/updateCategories/{categoryId}:
    put:
      summary: Update category by id (admin)
      tags:
        - Categories
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                categoryName:
                  type: string
      responses:
        '200':
          description: Updated

  /v1/categories/deleteCategories/{categoryId}:
    delete:
      summary: Delete category by id (admin)
      tags:
        - Categories
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted

  /v1/categories/{categoryId}/subcategories:
    post:
      summary: Add sub-category under category (admin)
      tags:
        - Categories
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subCategoryName:
                  type: string
      responses:
        '201':
          description: Created

  /v1/categories/{categoryId}/subcategories/{subCategoryId}:
    put:
      summary: Update a sub-category (admin)
      tags:
        - Categories
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
        - in: path
          name: subCategoryId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subCategoryName:
                  type: string
      responses:
        '200':
          description: Updated

    delete:
      summary: Delete a sub-category (admin)
      tags:
        - Categories
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
        - in: path
          name: subCategoryId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
