tags:
  - name: Users
    description: User authentication and profile endpoints

paths:
  /v1/users/login:
    post:
      summary: User login
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  default: admin1@yopmail.com
                password:
                  type: string
                  default: Admin1@121
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /v1/users/checkToken:
    post:
      summary: Verify token and return basic user info
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token valid

  /v1/users/logout:
    post:
      summary: Logout current session
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out

  /v1/users/forgotPassword:
    post:
      summary: Request a password reset link
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Reset link sent (if email exists)

  /v1/users/resetPassword:
    post:
      summary: Reset password using token
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                token:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password reset successful

  /v1/users/profile:
    get:
      summary: Get current user profile
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile returned
