tags:
  - name: Products
    description: Products endpoints

paths:
  /v1/products:
    post:
      summary: Create single product (admin)
      tags:
        - Products
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Single product with optional image
              properties:
                productImage:
                  type: string
                  format: binary
                  description: Optional product image file
                productName:
                  type: string
                categoryId:
                  type: string
                  description: Category id or category name
                vendorsId:
                  type: string
                  description: Vendor id or vendor name
                companyId:
                  type: string
                  description: Company/brand id or name
                packSize:
                  type: string
                unit:
                  type: string
                shape:
                  type: string
                colour:
                  type: string
                printStatus:
                  type: string
                gstPct:
                  type: number
                taxableValue:
                  type: number
                perUnitRate:
                  type: number
                stockAlert:
                  type: number
                productType:
                  type: string
                expiryDate:
                  type: string
              example:
                productName: "Sample Product"
                categoryId: "Beverages"
                vendorsId: "Alpha Supplies"
                companyId: "Acme Brands"
                packSize: "500ml"
                unit: "pcs"
                gstPct: 18
                perUnitRate: 95.0
                stockAlert: 10
      responses:
        "201":
          description: Product created
        "400":
          description: Bad Request
        "500":
          description: Server Error
    get:
      summary: Get products with filters, pagination and sorting
      tags:
        - Products
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: category
          schema:
            type: string
          description: Category id or name
        - in: query
          name: vendor
          schema:
            type: string
          description: Vendor id or name
        - in: query
          name: company
          schema:
            type: string
          description: Company/brand id or name
        - in: query
          name: search
          schema:
            type: string
          description: Text to search in productName
        - in: query
          name: productType
          schema:
            type: string
          description: Text to productType
        - in: query
          name: fromDate
          schema:
            type: string
            format: date
        - in: query
          name: toDate
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: sortBy
          schema:
            type: string
            default: createdAt
        - in: query
          name: sortDir
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: List of products
        "500":
          description: Server Error
    put:
      summary: Bulk update products (admin) - provide `products` array in body
      tags:
        - Products
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                products:
                  type: array
                  items:
                    type: object
                    properties:
                      _id:
                        type: string
                      productName:
                        type: string
            example:
              products:
                - _id: "603e2f1b8f1b2c0015a4d9b1"
                  productName: "Updated Name"
      responses:
        "200":
          description: Bulk update results
        "400":
          description: Bad Request
        "500":
          description: Server Error
    delete:
      summary: Bulk delete products by ids array (admin)
      tags:
        - Products
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
            example:
              ids: ["603e2f1b8f1b2c0015a4d9b1", "603e2f1b8f1b2c0015a4d9b2"]
      responses:
        "200":
          description: Bulk delete result
        "400":
          description: Bad Request
        "500":
          description: Server Error

  /v1/products/bulk-excel:
    post:
      summary: Create bulk products from Excel file (admin)
      tags:
        - Products
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Excel file (.xlsx/.xls) with product rows
              properties:
                file:
                  type: string
                  format: binary
                  description: Excel file containing product data. Columns should be productName, categoryName, vendor_name, brandName, etc.
              example:
                file: "products.xlsx"
      responses:
        "201":
          description: Bulk import completed
        "207":
          description: Partial import (some rows failed)
        "400":
          description: Bad Request
        "500":
          description: Server Error

  /v1/products/{id}:
    put:
      summary: Update a single product by id (admin)
      tags:
        - Products
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              description: Update product fields. Image upload is optional.
              properties:
                image:
                  type: string
                  format: binary
                  description: Optional product image file
                categoryId:
                  type: string
                vendorsId:
                  type: string
                companyId:
                  type: string
                productName:
                  type: string
                packSize:
                  type: string
                unit:
                  type: string
                shape:
                  type: string
                colour:
                  type: string
                printStatus:
                  type: string
                  enum: ["Printed", "Not Printed", "Pending"]
                gstPct:
                  type: number
                taxableValue:
                  type: number
                perUnitRate:
                  type: number
                stockAlert:
                  type: number
            example:
              categoryId: "65af12c98cd34bcdef112233"
              vendorsId: "65af1acd9ef45bbeae998877"
              companyId: "65af1bf34de89ccabc554433"
              productName: "Organic Basmati Rice"
              packSize: "1kg"
              unit: "Packet"
              shape: "Grains"
              colour: "White"
              printStatus: "Not Printed"
              image: "https://example.com/images/rice.png"
              gstPct: 5
              taxableValue: 142.85
              perUnitRate: 130
              stockAlert: 50
      responses:
        "200":
          description: Updated product
        "404":
          description: Not Found
        "500":
          description: Server Error

    delete:
      summary: Delete a single product by id (admin)
      tags:
        - Products
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product deleted
        "404":
          description: Not Found
        "500":
          description: Server Error
